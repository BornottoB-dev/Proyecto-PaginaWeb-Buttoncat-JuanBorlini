<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Button Circle -->
  <circle cx="18" cy="18" r="16" fill="#FDBA74" stroke="#000000" stroke-width="2.5" />
  <!-- Inner Concave Groove -->
  <circle cx="18" cy="18" r="10.5" fill="#EA580C" fill-opacity="0.25" stroke="#000000" stroke-width="1.2" />
  <!-- 4 Button Holes with Recessed Depth Effect -->
  <circle cx="13.5" cy="13.5" r="2.2" fill="#9A3412" />
  <circle cx="13.5" cy="13.5" r="1.6" fill="#000000" />
  
  <circle cx="22.5" cy="13.5" r="2.2" fill="#9A3412" />
  <circle cx="22.5" cy="13.5" r="1.6" fill="#000000" />

  <circle cx="13.5" cy="22.5" r="2.2" fill="#9A3412" />
  <circle cx="13.5" cy="22.5" r="1.6" fill="#000000" />

  <circle cx="22.5" cy="22.5" r="2.2" fill="#9A3412" />
  <circle cx="22.5" cy="22.5" r="1.6" fill="#000000" />

  <!-- Thread Stitches (X) -->
  <line x1="13.5" y1="13.5" x2="22.5" y2="22.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="22.5" y1="13.5" x2="13.5" y2="22.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
</svg>